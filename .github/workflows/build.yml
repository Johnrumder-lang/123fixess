name: Build LockOn Fabric 26.3
on:
  push:
    branches: [lockon-fixed]
    paths-ignore: ['LockOn-26.3-fixed.jar']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile against real Minecraft and Fabric APIs
        run: gradle --no-daemon build --stacktrace
      - name: Publish successful build to this branch
        run: |
          test -f build/libs/lockon-1.2.1.jar
          cp build/libs/lockon-1.2.1.jar LockOn-26.3-fixed.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f LockOn-26.3-fixed.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled 26.3 Fabric jar [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LockOn-26.3-fixed
          path: LockOn-26.3-fixed.jar
