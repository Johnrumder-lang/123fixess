name: Build LockOn Fabric 26.3 (versioned JAR)
on:
  push:
    branches: [lockon-fixed]
    paths-ignore: ['LockOn-26.3-v*.jar']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile against Minecraft 26.3 and Fabric API
        run: gradle --no-daemon build --stacktrace
      - name: Publish versioned JAR after successful build
        run: |
          test -s build/libs/lockon-1.5.2.jar
          cp build/libs/lockon-1.5.2.jar LockOn-26.3-v1.5.2.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f LockOn-26.3-v1.5.2.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish LockOn-26.3-v1.5.2.jar [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LockOn-26.3-v1.5.2
          path: LockOn-26.3-v1.5.2.jar
