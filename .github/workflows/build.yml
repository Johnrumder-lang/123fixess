name: Build LockOn Fabric 26.3 (versioned JAR)
on:
  push:
    branches: [lockon-fixed]
    paths-ignore: ['LockOn-26.3-v*.jar', 'LockOn-Server-Paper-26.3-v*.jar']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile against Minecraft 26.3 and Fabric API
        run: gradle --no-daemon build --stacktrace
      - name: Test survival input ownership and manual takeover
        run: python3 tools/test_survival_input.py
      - name: Test combat weapon swaps, shields and food lifecycle
        run: python3 tools/test_combat_actions.py
      - name: Test pathfinding on controlled terrain grids
        run: python3 tools/test_navigation.py
      - name: Test combat tactics (deterministic rules, no Minecraft client)
        run: |
          mkdir -p build/combat-tactics-tests
          javac --release 25 -d build/combat-tactics-tests src/main/java/lockon/CombatTactics.java src/test/java/lockon/CombatTacticsTest.java
          java -cp build/combat-tactics-tests lockon.CombatTacticsTest
      - name: Test survival mining policy and resources
        run: |
          mkdir -p build/survival-policy-tests
          javac --release 25 -d build/survival-policy-tests src/main/java/lockon/SurvivalPolicy.java src/test/java/lockon/SurvivalPolicyTest.java
          java -cp build/survival-policy-tests lockon.SurvivalPolicyTest
      - name: Test staircase exit clearance and drop collection
        run: |
          mkdir -p build/mining-tests
          javac --release 25 -d build/mining-tests src/main/java/lockon/MiningPlan.java src/test/java/lockon/MiningPlanTest.java
          java -cp build/mining-tests lockon.MiningPlanTest
      - name: Test autonomous wood-to-tools progression
        run: |
          mkdir -p build/autoplay-tests
          javac --release 25 -d build/autoplay-tests src/main/java/lockon/AutoplayPlan.java src/test/java/lockon/AutoplayPlanTest.java
          java -cp build/autoplay-tests lockon.AutoplayPlanTest
          python3 tools/test_autoplay_sources.py
      - name: Check administrator world scanner and snapshot tests
        run: |
          python3 -m py_compile tools/export_server_world.py tools/test_export_server_world.py
          python3 tools/test_export_server_world.py
          python3 tools/export_server_world.py --help >/dev/null
      - name: Verify 26.3 attack and punch packet sequence
        run: python3 tools/test_punch_protocol.py
      - name: Build optional Paper 26.3 live-player companion
        run: gradle --no-daemon -p server-paper build --stacktrace
      - name: Publish versioned JAR after successful build
        run: |
          test -s build/libs/lockon-3.6.0.jar
          test -s server-paper/build/libs/lockon-paper-3.6.0.jar
          cp build/libs/lockon-3.6.0.jar LockOn-26.3-v3.6.0.jar
          cp server-paper/build/libs/lockon-paper-3.6.0.jar LockOn-Server-Paper-26.3-v3.6.0.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f LockOn-26.3-v3.6.0.jar LockOn-Server-Paper-26.3-v3.6.0.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish LockOn-26.3-v3.6.0.jar [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LockOn-26.3-v3.6.0
          path: |
            LockOn-26.3-v3.6.0.jar
            LockOn-Server-Paper-26.3-v3.6.0.jar
