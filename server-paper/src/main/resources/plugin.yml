name: LockOnPlayerFeed
version: '2.8.0'
main: lockon.paper.LockOnPlayerFeed
api-version: '26.3'
description: Opt-in, permission-gated live player coordinates for the LockOn Fabric overlay.
commands:
  lockonshare:
    description: Allow or stop sharing your location to authorized LockOn viewers.
    usage: /lockonshare <on|off|status>
    permission: lockon.share
permissions:
  lockon.view:
    description: View positions of players who opted in to sharing.
    default: op
  lockon.share:
    description: Control your own location sharing.
    default: true
